<div class="container">
  <!-- PROGRESS BAR -->
  <div class="progress-bar">
    <div class="progress-fill" [style.width.%]="progressPercent"></div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content-wrapper">
    <!-- LEFT NAVIGATION -->
    <div class="nav-section">
      <div class="nav-title">Steps</div>
      <div class="nav-buttons">
        @for (step of steps; track step.formUrl; let i = $index) {
          <button class="nav-btn" [class.active]="i === currentStepIndex" (click)="loadStep(i)">
            {{ step.formTitle }}
          </button>
        }
      </div>
    </div>

    <!-- STEP FORM -->
    <app-asset-step-form [loadedStep]="currentLoadedStep" [isJoint]="isJoint" [isEditing]="isEditing" />
  </div>

  <!-- FOOTER -->
  <div class="footer-section">
    <div class="footer-info">
      Step {{ currentStepIndex + 1 }} of {{ steps.length }}
      @if (isLastStep && !allStepsComplete) {
        <span class="incomplete-hint">Complete all required fields to submit</span>
      }
    </div>
    <div class="footer-buttons">
      <button class="btn-secondary" (click)="toggleEdit()">{{ isEditing ? '🔒 Lock' : '✎ Edit' }}</button>
      <button class="btn-secondary" (click)="onDraft()">Draft</button>
      <button class="btn-secondary" [disabled]="isFirstStep" (click)="previous()">← Previous</button>
      @if (!isLastStep) {
        <button class="btn-primary" (click)="next()">Next →</button>
      } @else if (allStepsComplete) {
        <button class="btn-success" (click)="onSubmit()">✓ Submit</button>
      }
      <button class="btn-secondary close-icon" (click)="close()">✕ Close</button>
    </div>
  </div>
</div>
