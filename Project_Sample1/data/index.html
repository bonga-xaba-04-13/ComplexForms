<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <!-- CLOSE BUTTON -->
        <button class="modal-close-btn" id="closeBtn" aria-label="Close form">&#x2715;</button>

        <!-- TOP PREVIEW SECTION -->
        <div class="preview-section">
            <div class="preview-title">Captured Data</div>
            <div class="preview-content" id="previewContent">
                <div style="padding: 12px; color: var(--text-light); font-size: 13px;">Complete form steps to see preview data...</div>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="content-wrapper">
            <!-- LEFT NAVIGATION -->
            <div class="nav-section">
                <div class="nav-title">Forms</div>
                <div class="nav-buttons">
                    <button class="nav-btn active" data-step="0">Personal Info</button>
                    <button class="nav-btn" data-step="1">Professional</button>
                    <button class="nav-btn" data-step="2">Documents</button>
                </div>
            </div>

            <!-- MAIN FORM -->
            <div class="form-section">
                <div class="form-header">
                    <h1 class="form-title" id="formTitle">Personal Information</h1>
                    <p class="form-subtitle" id="formSubtitle">Enter your basic details</p>
                </div>

                <div class="form-content">
                    <!-- STEP 1: PERSONAL INFO -->
                    <div class="form-step active" data-step="0">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name *</label>
                                <input type="text" id="firstName" name="firstName" placeholder="John" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name *</label>
                                <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Email Address *</label>
                                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number *</label>
                                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="dob">Date of Birth *</label>
                                <input type="date" id="dob" name="dob" required>
                            </div>
                            <div class="form-group">
                                <label for="gender">Gender *</label>
                                <select id="gender" name="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                    <option value="prefer-not">Prefer Not to Say</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row full">
                            <div class="form-group">
                                <label for="address">Address *</label>
                                <input type="text" id="address" name="address" placeholder="123 Main Street, City, State" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city" placeholder="New York" required>
                            </div>
                            <div class="form-group">
                                <label for="postalCode">Postal Code *</label>
                                <input type="text" id="postalCode" name="postalCode" placeholder="10001" required>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 2: PROFESSIONAL INFO -->
                    <div class="form-step" data-step="1">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="jobTitle">Job Title *</label>
                                <input type="text" id="jobTitle" name="jobTitle" placeholder="Software Engineer" required>
                            </div>
                            <div class="form-group">
                                <label for="department">Department *</label>
                                <select id="department" name="department" required>
                                    <option value="">Select Department</option>
                                    <option value="engineering">Engineering</option>
                                    <option value="sales">Sales</option>
                                    <option value="marketing">Marketing</option>
                                    <option value="hr">Human Resources</option>
                                    <option value="finance">Finance</option>
                                    <option value="operations">Operations</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="manager">Direct Manager *</label>
                                <input type="text" id="manager" name="manager" placeholder="Manager Name" required>
                            </div>
                            <div class="form-group">
                                <label for="startDate">Start Date *</label>
                                <input type="date" id="startDate" name="startDate" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="employmentType">Employment Type *</label>
                                <select id="employmentType" name="employmentType" required>
                                    <option value="">Select Type</option>
                                    <option value="full-time">Full Time</option>
                                    <option value="part-time">Part Time</option>
                                    <option value="contract">Contract</option>
                                    <option value="temporary">Temporary</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="salary">Annual Salary (USD) *</label>
                                <input type="number" id="salary" name="salary" placeholder="75000" min="0" required>
                            </div>
                        </div>

                        <div class="form-row full">
                            <div class="form-group">
                                <label>Work Location Preference</label>
                                <div class="checkbox-group">
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="remote" name="workLocation" value="remote">
                                        <label for="remote">Remote</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="onsite" name="workLocation" value="onsite">
                                        <label for="onsite">On-site</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="hybrid" name="workLocation" value="hybrid">
                                        <label for="hybrid">Hybrid</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-row full">
                            <div class="form-group">
                                <label for="skills">Key Skills</label>
                                <textarea id="skills" name="skills" placeholder="Enter skills separated by commas..."></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 3: DOCUMENTS -->
                    <div class="form-step" data-step="2">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="ssn">Social Security Number *</label>
                                <input type="text" id="ssn" name="ssn" placeholder="XXX-XX-XXXX" required>
                            </div>
                            <div class="form-group">
                                <label for="taxId">Tax ID *</label>
                                <input type="text" id="taxId" name="taxId" placeholder="XX-XXXXXXX" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="driversLicense">Driver's License Number</label>
                                <input type="text" id="driversLicense" name="driversLicense" placeholder="License #">
                            </div>
                            <div class="form-group">
                                <label for="licenseExpiry">License Expiry Date</label>
                                <input type="date" id="licenseExpiry" name="licenseExpiry">
                            </div>
                        </div>

                        <div class="form-row full">
                            <div class="form-group">
                                <label>Background Check Authorization *</label>
                                <div class="checkbox-group">
                                    <div class="checkbox-item">
                                        <input type="radio" id="bgCheckYes" name="backgroundCheck" value="yes" required>
                                        <label for="bgCheckYes">Authorized</label>
                                    </div>
                                    <div class="checkbox-item">
                                        <input type="radio" id="bgCheckNo" name="backgroundCheck" value="no" required>
                                        <label for="bgCheckNo">Not Authorized</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-row full">
                            <div class="form-group">
                                <label for="emergencyContact">Emergency Contact Name *</label>
                                <input type="text" id="emergencyContact" name="emergencyContact" placeholder="Contact Name" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="emergencyPhone">Emergency Contact Phone *</label>
                                <input type="tel" id="emergencyPhone" name="emergencyPhone" placeholder="+1 (555) 987-6543" required>
                            </div>
                            <div class="form-group">
                                <label for="relationship">Relationship *</label>
                                <select id="relationship" name="relationship" required>
                                    <option value="">Select Relationship</option>
                                    <option value="spouse">Spouse</option>
                                    <option value="parent">Parent</option>
                                    <option value="child">Child</option>
                                    <option value="sibling">Sibling</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row full">
                            <div class="form-group">
                                <label>Agreement & Consent *</label>
                                <div class="checkbox-group">
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                                        <label for="agreeTerms">I agree to the terms and conditions</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer-section">
            <div class="footer-info" id="footerInfo">Step 1 of 3</div>
            <div class="footer-buttons">
                <button class="btn-secondary" id="prevBtn" disabled>← Previous</button>
                <button class="btn-primary" id="nextBtn">Next →</button>
                <button class="btn-success" id="submitBtn" style="display: none;">✓ Submit</button>
            </div>
        </div>
    </div>

    <script>
        const formData = {};
        let currentStep = 0;
        const totalSteps = 3;

        const stepTitles = [
            { title: 'Personal Information', subtitle: 'Enter your basic details' },
            { title: 'Professional Details', subtitle: 'Provide your work information' },
            { title: 'Documents & Emergency', subtitle: 'Complete additional documents' }
        ];

        const navButtons = document.querySelectorAll('.nav-btn');
        const formSteps = document.querySelectorAll('.form-step');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const closeBtn = document.getElementById('closeBtn');
        const previewContent = document.getElementById('previewContent');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const footerInfo = document.getElementById('footerInfo');

        // Close button
        closeBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to close? Any unsaved data will be lost.')) {
                resetForm();
            }
        });

        // Navigation button clicks
        navButtons.forEach((btn, index) => {
            btn.addEventListener('click', () => {
                if (index <= currentStep || isStepComplete(index - 1)) {
                    goToStep(index);
                }
            });
        });

        // Previous button
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                saveStepData();
                currentStep--;
                updateForm();
            }
        });

        // Next button
        nextBtn.addEventListener('click', () => {
            if (validateCurrentStep()) {
                saveStepData();
                if (currentStep < totalSteps - 1) {
                    currentStep++;
                    updateForm();
                }
            }
        });

        // Submit button
        submitBtn.addEventListener('click', () => {
            if (validateCurrentStep()) {
                saveStepData();
                submitForm();
            }
        });

        function goToStep(step) {
            if (validateCurrentStep()) {
                saveStepData();
                currentStep = step;
                updateForm();
            }
        }

        function isStepComplete(stepIndex) {
            const inputs = formSteps[stepIndex].querySelectorAll('input[required], select[required], textarea[required]');
            return Array.from(inputs).every(input => {
                if (input.type === 'checkbox' || input.type === 'radio') {
                    const name = input.name;
                    const group = formSteps[stepIndex].querySelectorAll(`[name="${name}"]`);
                    return Array.from(group).some(g => g.checked);
                }
                return input.value.trim() !== '';
            });
        }

        function validateCurrentStep() {
            const inputs = formSteps[currentStep].querySelectorAll('input[required], select[required], textarea[required]');
            let isValid = true;

            inputs.forEach(input => {
                if (input.type === 'checkbox' || input.type === 'radio') {
                    const name = input.name;
                    const group = formSteps[currentStep].querySelectorAll(`[name="${name}"]`);
                    const isChecked = Array.from(group).some(g => g.checked);
                    if (!isChecked) {
                        input.style.borderColor = 'var(--error)';
                        isValid = false;
                    }
                } else if (!input.value.trim()) {
                    input.style.borderColor = 'var(--error)';
                    isValid = false;
                } else {
                    input.style.borderColor = '';
                }
            });

            return isValid;
        }

        function saveStepData() {
            const inputs = formSteps[currentStep].querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                if (input.type === 'checkbox' || input.type === 'radio') {
                    if (input.checked) {
                        formData[input.name] = input.value;
                    }
                } else {
                    if (input.value) {
                        formData[input.name] = input.value;
                    }
                }
            });
        }

        function updateForm() {
            formSteps.forEach((step, index) => {
                step.classList.toggle('active', index === currentStep);
            });

            navButtons.forEach((btn, index) => {
                btn.classList.toggle('active', index === currentStep);
                btn.classList.toggle('completed', index < currentStep && isStepComplete(index));
            });

            prevBtn.disabled = currentStep === 0;
            nextBtn.style.display = currentStep === totalSteps - 1 ? 'none' : 'block';
            submitBtn.style.display = currentStep === totalSteps - 1 ? 'block' : 'none';

            formTitle.textContent = stepTitles[currentStep].title;
            formSubtitle.textContent = stepTitles[currentStep].subtitle;

            footerInfo.textContent = `Step ${currentStep + 1} of ${totalSteps}`;

            updatePreview();

            document.querySelector('.form-section').scrollTop = 0;
        }

        function updatePreview() {
            let previewHTML = '';

            if (isStepComplete(0)) {
                previewHTML += `
                    <div class="preview-row">
                        <div class="preview-row-title">Step 1</div>
                        <div class="preview-items-container">
                            <div class="preview-item">
                                <div class="preview-label">Full Name</div>
                                <div class="preview-value">${formData.firstName || ''} ${formData.lastName || ''}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">Email</div>
                                <div class="preview-value">${formData.email || 'N/A'}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">Phone</div>
                                <div class="preview-value">${formData.phone || 'N/A'}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">City</div>
                                <div class="preview-value">${formData.city || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (isStepComplete(1)) {
                previewHTML += `
                    <div class="preview-row">
                        <div class="preview-row-title">Step 2</div>
                        <div class="preview-items-container">
                            <div class="preview-item">
                                <div class="preview-label">Job Title</div>
                                <div class="preview-value">${formData.jobTitle || 'N/A'}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">Department</div>
                                <div class="preview-value">${formData.department || 'N/A'}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">Employment Type</div>
                                <div class="preview-value">${formData.employmentType || 'N/A'}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">Salary</div>
                                <div class="preview-value">$${formData.salary || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (isStepComplete(2)) {
                previewHTML += `
                    <div class="preview-row">
                        <div class="preview-row-title">Step 3</div>
                        <div class="preview-items-container">
                            <div class="preview-item">
                                <div class="preview-label">SSN</div>
                                <div class="preview-value">${formData.ssn || 'N/A'}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">Emergency Contact</div>
                                <div class="preview-value">${formData.emergencyContact || 'N/A'}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">Contact Phone</div>
                                <div class="preview-value">${formData.emergencyPhone || 'N/A'}</div>
                            </div>
                            <div class="preview-item">
                                <div class="preview-label">Relationship</div>
                                <div class="preview-value">${formData.relationship || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            previewContent.innerHTML = previewHTML || '<div style="padding: 12px; color: var(--text-light); font-size: 12px; text-align: center;">Complete form steps to view captured data...</div>';
        }

        function submitForm() {
            console.log('Form submitted with data:', formData);
            alert('Form submitted successfully!\n\nForm data:\n' + JSON.stringify(formData, null, 2));
            resetForm();
        }

        function resetForm() {
            currentStep = 0;
            Object.keys(formData).forEach(key => delete formData[key]);
            formSteps.forEach(step => {
                const inputs = step.querySelectorAll('input, select, textarea');
                inputs.forEach(input => {
                    if (input.type === 'checkbox' || input.type === 'radio') {
                        input.checked = false;
                    } else {
                        input.value = '';
                    }
                    input.style.borderColor = '';
                });
            });
            updateForm();
        }

        updateForm();
    </script>
</body>
</html>
