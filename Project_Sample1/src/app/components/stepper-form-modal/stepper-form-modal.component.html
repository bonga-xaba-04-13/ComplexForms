<div class="stepper-modal-container">
  <!-- Header -->
  <div class="modal-header">
    <div class="header-content">
      <div class="header-info">
        <h2 class="header-title">{{ stepperFormLabel }}</h2>
        <p class="header-description">{{ stepperFormDescription }}</p>
      </div>
      <button mat-icon-button (click)="closeDialog()" class="close-button">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-container">
    <mat-progress-bar
      mode="determinate"
      [value]="getProgressPercentage()"
    ></mat-progress-bar>
    <div class="progress-text">
      Step {{ currentStepIndex + 1 }} of {{ loadedSteps.length }}
    </div>
  </div>

  <!-- Main Content -->
  <div class="modal-content">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>Steps</h3>
      </div>
      <nav class="steps-list">
        <button
          *ngFor="let step of loadedSteps; let i = index"
          [class.active]="currentStepIndex === i"
          [class.completed]="i < currentStepIndex"
          class="step-item"
          (click)="currentStepIndex = i"
          type="button"
        >
          <span class="step-number">{{ i + 1 }}</span>
          <div class="step-info">
            <div class="step-label">{{ step.formLabel }}</div>
            <div class="step-description">{{ step.formDescription }}</div>
          </div>
        </button>
      </nav>
    </aside>

    <!-- Form Content -->
    <main class="form-content">
      <div *ngIf="isLoading" class="loading-message">
        Loading form...
      </div>

      <div *ngIf="!isLoading && getCurrentStep() as currentStep" class="step-form">
        <div class="step-header">
          <div class="step-header-title">
            <h3 class="step-title">{{ currentStep.formLabel }}</h3>
            <p class="step-description">{{ currentStep.formDescription }}</p>
          </div>

          <!-- Participant Switcher (shown only on dynamic steps in joint mode) -->
          <div
            *ngIf="shouldShowParticipantSwitcher(currentStep)"
            class="participant-switcher"
          >
            <div class="participant-buttons">
              <button
                *ngFor="let participant of participants; let i = index"
                [class.active]="activeParticipantIndex === i"
                [class.valid]="currentStep.participantForms[i].valid"
                [class.invalid]="!currentStep.participantForms[i].valid"
                (click)="setActiveParticipant(i)"
                type="button"
                class="participant-button"
              >
                <span class="button-label">{{ participant.label }}</span>
                <span
                  *ngIf="!currentStep.participantForms[i].valid"
                  class="validity-indicator invalid"
                  title="Form incomplete"
                >
                  ✕
                </span>
                <span
                  *ngIf="currentStep.participantForms[i].valid"
                  class="validity-indicator valid"
                  title="Form complete"
                >
                  ✓
                </span>
              </button>
            </div>
          </div>
        </div>

        <app-form-control-renderer
          [formGroup]="getActiveFormGroup(currentStep)"
          [controls]="currentStep.controls"
          [controlRows]="currentStep.controlRows"
        ></app-form-control-renderer>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button
      mat-stroked-button
      (click)="goToPreviousStep()"
      [disabled]="isFirstStep()"
      class="nav-button"
    >
      Previous
    </button>

    <div class="footer-spacer"></div>

    <button
      mat-raised-button
      color="primary"
      (click)="goToNextStep()"
      *ngIf="!isLastStep()"
      class="nav-button"
    >
      Next
    </button>

    <button
      mat-raised-button
      color="accent"
      (click)="submitForm()"
      *ngIf="isLastStep()"
      [disabled]="!isFormValid() || isSubmitting"
      class="nav-button submit-button"
    >
      <mat-icon *ngIf="isSubmitting" class="spinner">hourglass_bottom</mat-icon>
      {{ isSubmitting ? 'Submitting...' : 'Submit' }}
    </button>
  </div>
</div>
