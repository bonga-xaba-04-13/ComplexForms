<mat-toolbar color="primary" class="launcher-toolbar">
  <span>Patient Data Forms</span>
  <span class="spacer"></span>
  <a mat-button routerLink="/intakes">Intakes</a>
  <button mat-button (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>
</mat-toolbar>

<main class="launcher-content">
  <mat-card appearance="outlined" class="welcome-card">
    <mat-card-header>
      <mat-card-title>Welcome</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>Click below to open the Patient Intake Registration form.</p>
    </mat-card-content>

    <mat-card-actions align="end">
      <button
        mat-raised-button
        color="primary"
        (click)="openPatientCapture()">
        Open Patient Capture Form
      </button>
    </mat-card-actions>
  </mat-card>
</main>
