<div class="launcher-container">
  <div class="launcher-header">
    <h1>Patient Data Forms</h1>
    <button (click)="logout()" class="btn-logout">Logout</button>
  </div>

  <div class="launcher-content">
    <div class="welcome-card">
      <h2>Welcome</h2>
      <p>Click a button below to open a form.</p>

      <div class="button-group">
        <button (click)="openPatientCapture()" class="btn-open-form">
          📋 Patient Capture (v2 - mock-dev1)
        </button>
        <button (click)="openPatientRegistration()" class="btn-open-form btn-primary">
          🆕 Patient Registration (mock-dev2)
        </button>
      </div>
    </div>
  </div>
</div>
