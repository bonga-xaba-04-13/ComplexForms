<div class="login-container">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header>
      <mat-card-title>Patient Data Forms</mat-card-title>
      <mat-card-subtitle>Demo Login</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="login()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input
            matInput
            formControlName="username"
            placeholder="Enter any username"
            autocomplete="username">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            placeholder="Enter any password"
            autocomplete="current-password">
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-submit">
          Continue as Demo User
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <p class="login-hint">This is a demo login. Any credentials are accepted.</p>
    </mat-card-footer>
  </mat-card>
</div>
