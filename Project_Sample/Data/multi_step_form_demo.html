<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #64748b;
            --border: #e2e8f0;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --bg-light: #f9fafb;
            --success: #059669;
            --error: #dc2626;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--white);
        }

        /* ===== MAIN CONTENT AREA ===== */
        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        /* ===== LEFT SECTION - NAVIGATION ===== */
        .nav-section {
            width: 200px;
            background-color: var(--bg-light);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            overflow-y: auto;
        }

        .nav-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--secondary);
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-btn {
            padding: 12px 16px;
            background-color: var(--white);
            border: 1px solid var(--border);
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            border-radius: 4px;
        }

        .nav-btn:hover {
            background-color: var(--white);
            border-color: var(--primary-light);
            color: var(--primary-light);
        }

        .nav-btn.active {
            background-color: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            font-weight: 600;
        }

        .nav-btn.completed {
            border-color: var(--success);
            color: var(--success);
        }

        /* ===== MAIN FORM SECTION ===== */
        .form-section {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-subtitle {
            font-size: 14px;
            color: var(--text-light);
        }

        .form-content {
            flex: 1;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-dark);
            background-color: var(--white);
            font-family: inherit;
            transition: border-color 0.2s ease;
            border-radius: 4px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: inset 0 0 0 2px rgba(59, 130, 246, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'%3e%3c/path%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 20px;
            padding-right: 32px;
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox-item label {
            text-transform: none;
            font-weight: 400;
            cursor: pointer;
            margin: 0;
        }

        /* ===== FOOTER SECTION ===== */
        .footer-section {
            background-color: var(--white);
            border-top: 1px solid var(--border);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-info {
            font-size: 12px;
            color: var(--text-light);
        }

        .footer-buttons {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
            border: 1px solid transparent;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--text-dark);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--bg-light);
            border-color: var(--text-dark);
        }

        .btn-secondary:disabled {
            color: var(--secondary);
            border-color: var(--border);
            cursor: not-allowed;
            background-color: var(--bg-light);
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
            border: 1px solid var(--primary);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-light);
            border-color: var(--primary-light);
        }

        .btn-primary:disabled {
            background-color: var(--secondary);
            border-color: var(--secondary);
            cursor: not-allowed;
        }

        .btn-success {
            background-color: var(--success);
            color: var(--white);
            border: 1px solid var(--success);
        }

        .btn-success:hover {
            background-color: #047857;
        }

        /* ===== HIDDEN FORM STEPS ===== */
        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .nav-section {
                width: 160px;
                padding: 20px 12px;
            }

            .form-section {
                padding: 30px;
            }
        }

        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
            }

            .nav-section {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 15px 20px;
                max-height: 80px;
                overflow-x: auto;
                overflow-y: hidden;
            }

            .nav-buttons {
                flex-direction: row;
                gap: 12px;
                overflow-x: auto;
            }

            .nav-btn {
                white-space: nowrap;
                flex-shrink: 0;
            }

            .form-section {
                padding: 20px;
            }

            .footer-buttons {
                flex-wrap: wrap;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- MAIN CONTENT -->
        <div class="content-wrapper">
            <!-- LEFT NAVIGATION -->
            <div class="nav-section">
                <div class="nav-title">Forms</div>
                <div class="nav-buttons">
                    <button class="nav-btn active" data-step="0">Personal Info</button>
                    <button class="nav-btn" data-step="1">Medical & Insurance</button>
                    <button class="nav-btn" data-step="2">Consent & Info</button>
                </div>
            </div>

            <!-- MAIN FORM -->
            <div class="form-section">
                <div class="form-header">
                    <h1 class="form-title" id="formTitle">Personal Information</h1>
                    <p class="form-subtitle" id="formSubtitle">Enter your basic details</p>
                </div>

                <div class="form-content">
                    <!-- STEP 1: PERSONAL INFO -->
                    <div class="form-step active" data-step="0">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name *</label>
                                <input type="text" id="firstName" name="firstName" placeholder="John" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name *</label>
                                <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Email Address *</label>
                                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number *</label>
                                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="dob">Date of Birth *</label>
                                <input type="date" id="dob" name="dob" required>
                            </div>
                            <div class="form-group">
                                <label for="gender">Gender *</label>
                                <select id="gender" name="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                    <option value="prefer-not">Prefer Not to Say</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row full">
                            <div class="form-group">
                                <label for="address">Address *</label>
                                <input type="text" id="address" name="address" placeholder="123 Main Street, City, State" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city" placeholder="New York" required>
                            </div>
                            <div class="form-group">
                                <label for="postalCode">Postal Code *</label>
                                <input type="text" id="postalCode" name="postalCode" placeholder="10001" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="middleName">Middle Name</label>
                                <input type="text" id="middleName" name="middleName" placeholder="Optional">
                            </div>
                            <div class="form-group">
                                <label for="suffix">Suffix</label>
                                <select id="suffix" name="suffix">
                                    <option value="">None</option>
                                    <option value="jr">Jr.</option>
                                    <option value="sr">Sr.</option>
                                    <option value="ii">II</option>
                                    <option value="iii">III</option>
                                    <option value="iv">IV</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="preferredLanguage">Preferred Language</label>
                                <select id="preferredLanguage" name="preferredLanguage">
                                    <option value="">Select Language</option>
                                    <option value="english">English</option>
                                    <option value="spanish">Spanish</option>
                                    <option value="mandarin">Mandarin</option>
                                    <option value="french">French</option>
                                    <option value="vietnamese">Vietnamese</option>
                                    <option value="korean">Korean</option>
                                    <option value="arabic">Arabic</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="maritalStatus">Marital Status</label>
                                <select id="maritalStatus" name="maritalStatus">
                                    <option value="">Select Status</option>
                                    <option value="single">Single</option>
                                    <option value="married">Married</option>
                                    <option value="divorced">Divorced</option>
                                    <option value="widowed">Widowed</option>
                                    <option value="domestic-partner">Domestic Partner</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="raceEthnicity">Race/Ethnicity</label>
                                <select id="raceEthnicity" name="raceEthnicity">
                                    <option value="">Select Race/Ethnicity</option>
                                    <option value="white">White</option>
                                    <option value="black">Black or African American</option>
                                    <option value="hispanic">Hispanic or Latino</option>
                                    <option value="asian">Asian</option>
                                    <option value="native-american">Native American or Alaska Native</option>
                                    <option value="pacific-islander">Native Hawaiian or Pacific Islander</option>
                                    <option value="two-or-more">Two or More Races</option>
                                    <option value="prefer-not">Prefer Not to Say</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="occupation">Occupation</label>
                                <input type="text" id="occupation" name="occupation" placeholder="Your occupation">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="insuranceSubscriberId">Insurance Subscriber ID</label>
                                <input type="text" id="insuranceSubscriberId" name="insuranceSubscriberId" placeholder="Your insurance ID">
                            </div>
                            <div class="form-group">
                                <label for="allergies">Known Allergies</label>
                                <input type="text" id="allergies" name="allergies" placeholder="List any known allergies">
                            </div>
                        </div>
                    </div>

                    <!-- STEP 2: MEDICAL & INSURANCE INFO -->
                    <div class="form-step" data-step="1">
                        <!-- MEDICAL HISTORY SECTION -->
                        <div style="margin-bottom: 30px;">
                            <h3 style="font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 15px;">Medical History</h3>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="currentMedications">Current Medications</label>
                                    <textarea id="currentMedications" name="currentMedications" placeholder="List current medications, dosages, and frequency..."></textarea>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="drugAllergies">Drug Allergies</label>
                                    <textarea id="drugAllergies" name="drugAllergies" placeholder="List any drug allergies and reactions..."></textarea>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label>Chronic Conditions</label>
                                    <div class="checkbox-group" style="flex-direction: column; gap: 8px;">
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="diabetes" name="chronicConditions" value="diabetes">
                                            <label for="diabetes">Diabetes</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="hypertension" name="chronicConditions" value="hypertension">
                                            <label for="hypertension">Hypertension</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="asthma" name="chronicConditions" value="asthma">
                                            <label for="asthma">Asthma</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="heart-disease" name="chronicConditions" value="heart-disease">
                                            <label for="heart-disease">Heart Disease</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="arthritis" name="chronicConditions" value="arthritis">
                                            <label for="arthritis">Arthritis</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="copd" name="chronicConditions" value="copd">
                                            <label for="copd">COPD</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="thyroid" name="chronicConditions" value="thyroid">
                                            <label for="thyroid">Thyroid Disease</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="cancer" name="chronicConditions" value="cancer">
                                            <label for="cancer">Cancer</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="other-condition" name="chronicConditions" value="other">
                                            <label for="other-condition">Other</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="previousSurgeries">Previous Surgeries</label>
                                    <textarea id="previousSurgeries" name="previousSurgeries" placeholder="List any previous surgeries with dates..."></textarea>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="familyMedicalHistory">Family Medical History</label>
                                    <textarea id="familyMedicalHistory" name="familyMedicalHistory" placeholder="Describe relevant family medical history..."></textarea>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="hospitalizationHistory">Hospitalization History</label>
                                    <textarea id="hospitalizationHistory" name="hospitalizationHistory" placeholder="List any hospitalizations with dates and reasons..."></textarea>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="currentHealthIssues">Current Health Issues or Concerns</label>
                                    <textarea id="currentHealthIssues" name="currentHealthIssues" placeholder="Describe any current health concerns..."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- INSURANCE INFORMATION SECTION -->
                        <div style="margin-bottom: 30px;">
                            <h3 style="font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 15px;">Insurance Information</h3>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="insuranceProvider">Insurance Provider Name</label>
                                    <input type="text" id="insuranceProvider" name="insuranceProvider" placeholder="e.g., Blue Cross Blue Shield">
                                </div>
                                <div class="form-group">
                                    <label for="insuranceType">Insurance Type</label>
                                    <select id="insuranceType" name="insuranceType">
                                        <option value="">Select Type</option>
                                        <option value="hmo">HMO</option>
                                        <option value="ppo">PPO</option>
                                        <option value="medicare">Medicare</option>
                                        <option value="medicaid">Medicaid</option>
                                        <option value="private">Private</option>
                                        <option value="self-pay">Self-Pay</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="policyNumber">Policy Number</label>
                                    <input type="text" id="policyNumber" name="policyNumber" placeholder="Your policy number">
                                </div>
                                <div class="form-group">
                                    <label for="groupNumber">Group Number</label>
                                    <input type="text" id="groupNumber" name="groupNumber" placeholder="Group number if applicable">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="memberId">Member ID</label>
                                    <input type="text" id="memberId" name="memberId" placeholder="Member ID">
                                </div>
                                <div class="form-group">
                                    <label for="coverageEffectiveDate">Coverage Effective Date</label>
                                    <input type="date" id="coverageEffectiveDate" name="coverageEffectiveDate">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="copayAmount">Copay Amount ($)</label>
                                    <input type="number" id="copayAmount" name="copayAmount" placeholder="0.00" min="0" step="0.01">
                                </div>
                                <div class="form-group">
                                    <label for="deductibleAmount">Deductible Amount ($)</label>
                                    <input type="number" id="deductibleAmount" name="deductibleAmount" placeholder="0.00" min="0" step="0.01">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="outOfPocketMax">Out-of-Pocket Maximum ($)</label>
                                    <input type="number" id="outOfPocketMax" name="outOfPocketMax" placeholder="0.00" min="0" step="0.01">
                                </div>
                            </div>
                        </div>

                        <!-- CARE COORDINATION SECTION -->
                        <div>
                            <h3 style="font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 15px;">Care Coordination</h3>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="primaryCarePhysician">Primary Care Physician Name</label>
                                    <input type="text" id="primaryCarePhysician" name="primaryCarePhysician" placeholder="Your primary care doctor">
                                </div>
                                <div class="form-group">
                                    <label for="physicianPhone">Physician Phone</label>
                                    <input type="tel" id="physicianPhone" name="physicianPhone" placeholder="+1 (555) 123-4567">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="pharmacyName">Pharmacy Name</label>
                                    <input type="text" id="pharmacyName" name="pharmacyName" placeholder="Your preferred pharmacy">
                                </div>
                                <div class="form-group">
                                    <label for="pharmacyPhone">Pharmacy Phone</label>
                                    <input type="tel" id="pharmacyPhone" name="pharmacyPhone" placeholder="+1 (555) 123-4567">
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="pharmacyLocation">Preferred Pharmacy Location</label>
                                    <input type="text" id="pharmacyLocation" name="pharmacyLocation" placeholder="Address or location">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 3: CONSENT & ADDITIONAL INFORMATION -->
                    <div class="form-step" data-step="2">
                        <!-- EMERGENCY CONTACT SECTION -->
                        <div style="margin-bottom: 30px;">
                            <h3 style="font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 15px;">Emergency Contact</h3>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="emergencyContact">Emergency Contact Name *</label>
                                    <input type="text" id="emergencyContact" name="emergencyContact" placeholder="Contact Name" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="emergencyPhone">Emergency Contact Phone *</label>
                                    <input type="tel" id="emergencyPhone" name="emergencyPhone" placeholder="+1 (555) 987-6543" required>
                                </div>
                                <div class="form-group">
                                    <label for="relationship">Relationship *</label>
                                    <select id="relationship" name="relationship" required>
                                        <option value="">Select Relationship</option>
                                        <option value="spouse">Spouse</option>
                                        <option value="parent">Parent</option>
                                        <option value="child">Child</option>
                                        <option value="sibling">Sibling</option>
                                        <option value="friend">Friend</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- MEDICAL AUTHORIZATIONS SECTION -->
                        <div style="margin-bottom: 30px;">
                            <h3 style="font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 15px;">Medical Authorizations</h3>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label>Consent to Treatment *</label>
                                    <div class="checkbox-group">
                                        <div class="checkbox-item">
                                            <input type="radio" id="consentYes" name="consentToTreatment" value="yes" required>
                                            <label for="consentYes">I consent to medical treatment</label>
                                        </div>
                                        <div class="checkbox-item">
                                            <input type="radio" id="consentNo" name="consentToTreatment" value="no" required>
                                            <label for="consentNo">I do not consent to treatment</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label>Medical Records Authorization *</label>
                                    <div class="checkbox-group">
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="medicalRecordsAuth" name="medicalRecordsAuthorization" required>
                                            <label for="medicalRecordsAuth">I authorize access to my medical records</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label>Privacy & HIPAA Authorization *</label>
                                    <div class="checkbox-group">
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="hipaaAuth" name="hipaaAuthorization" required>
                                            <label for="hipaaAuth">I acknowledge receiving and understanding the HIPAA privacy notice</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label>Insurance Assignment *</label>
                                    <div class="checkbox-group">
                                        <div class="checkbox-item">
                                            <input type="checkbox" id="insuranceAssignment" name="insuranceAssignment" required>
                                            <label for="insuranceAssignment">I authorize billing to my insurance company</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- COMMUNICATION PREFERENCES SECTION -->
                        <div style="margin-bottom: 30px;">
                            <h3 style="font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 15px;">Communication Preferences</h3>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="preferredContactMethod">Preferred Contact Method *</label>
                                    <select id="preferredContactMethod" name="preferredContactMethod" required>
                                        <option value="">Select Method</option>
                                        <option value="phone">Phone Call</option>
                                        <option value="email">Email</option>
                                        <option value="text">Text Message</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="bestTimeToContact">Best Time to Contact *</label>
                                    <select id="bestTimeToContact" name="bestTimeToContact" required>
                                        <option value="">Select Time</option>
                                        <option value="morning">Morning (8am-12pm)</option>
                                        <option value="afternoon">Afternoon (12pm-5pm)</option>
                                        <option value="evening">Evening (5pm-8pm)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- SPECIAL ACCOMMODATIONS SECTION -->
                        <div>
                            <h3 style="font-size: 16px; font-weight: 600; color: var(--primary); margin-bottom: 15px;">Special Accommodations</h3>

                            <div class="form-row full">
                                <div class="form-group">
                                    <label for="specialAccommodations">Special Accommodations or Needs</label>
                                    <textarea id="specialAccommodations" name="specialAccommodations" placeholder="e.g., wheelchair access, sign language interpreter, mobility assistance..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer-section">
            <div class="footer-info" id="footerInfo">Step 1 of 3</div>
            <div class="footer-buttons">
                <button class="btn-secondary" id="prevBtn" disabled>← Previous</button>
                <button class="btn-primary" id="nextBtn">Next →</button>
                <button class="btn-success" id="submitBtn" style="display: none;">✓ Submit</button>
            </div>
        </div>
    </div>

    <script>
        const formData = {};
        let currentStep = 0;
        const totalSteps = 3;

        const stepTitles = [
            { title: 'Personal Information', subtitle: 'Enter your personal details' },
            { title: 'Medical & Insurance Details', subtitle: 'Provide your medical and insurance information' },
            { title: 'Consent & Additional Information', subtitle: 'Complete authorization and preferences' }
        ];

        const navButtons = document.querySelectorAll('.nav-btn');
        const formSteps = document.querySelectorAll('.form-step');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const submitBtn = document.getElementById('submitBtn');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const footerInfo = document.getElementById('footerInfo');

        // Navigation button clicks
        navButtons.forEach((btn, index) => {
            btn.addEventListener('click', () => {
                if (index <= currentStep || isStepComplete(index - 1)) {
                    goToStep(index);
                }
            });
        });

        // Previous button
        prevBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                saveStepData();
                currentStep--;
                updateForm();
            }
        });

        // Next button
        nextBtn.addEventListener('click', () => {
            if (validateCurrentStep()) {
                saveStepData();
                if (currentStep < totalSteps - 1) {
                    currentStep++;
                    updateForm();
                }
            }
        });

        // Submit button
        submitBtn.addEventListener('click', () => {
            if (validateCurrentStep()) {
                saveStepData();
                submitForm();
            }
        });

        function goToStep(step) {
            if (validateCurrentStep()) {
                saveStepData();
                currentStep = step;
                updateForm();
            }
        }

        function isStepComplete(stepIndex) {
            const inputs = formSteps[stepIndex].querySelectorAll('input[required], select[required], textarea[required]');
            return Array.from(inputs).every(input => {
                if (input.type === 'checkbox' || input.type === 'radio') {
                    const name = input.name;
                    const group = formSteps[stepIndex].querySelectorAll(`[name="${name}"]`);
                    return Array.from(group).some(g => g.checked);
                }
                return input.value.trim() !== '';
            });
        }

        function validateCurrentStep() {
            const inputs = formSteps[currentStep].querySelectorAll('input[required], select[required], textarea[required]');
            let isValid = true;

            inputs.forEach(input => {
                if (input.type === 'checkbox' || input.type === 'radio') {
                    const name = input.name;
                    const group = formSteps[currentStep].querySelectorAll(`[name="${name}"]`);
                    const isChecked = Array.from(group).some(g => g.checked);
                    if (!isChecked) {
                        input.style.borderColor = 'var(--error)';
                        isValid = false;
                    }
                } else if (!input.value.trim()) {
                    input.style.borderColor = 'var(--error)';
                    isValid = false;
                } else {
                    input.style.borderColor = '';
                }
            });

            return isValid;
        }

        function saveStepData() {
            const inputs = formSteps[currentStep].querySelectorAll('input, select, textarea');
            inputs.forEach(input => {
                if (input.type === 'checkbox' || input.type === 'radio') {
                    if (input.checked) {
                        formData[input.name] = input.value;
                    }
                } else {
                    if (input.value) {
                        formData[input.name] = input.value;
                    }
                }
            });
        }

        function updateForm() {
            // Update form steps
            formSteps.forEach((step, index) => {
                step.classList.toggle('active', index === currentStep);
            });

            // Update nav buttons
            navButtons.forEach((btn, index) => {
                btn.classList.toggle('active', index === currentStep);
                btn.classList.toggle('completed', index < currentStep && isStepComplete(index));
            });

            // Update buttons
            prevBtn.disabled = currentStep === 0;
            nextBtn.style.display = currentStep === totalSteps - 1 ? 'none' : 'block';
            submitBtn.style.display = currentStep === totalSteps - 1 ? 'block' : 'none';

            // Update title and subtitle
            formTitle.textContent = stepTitles[currentStep].title;
            formSubtitle.textContent = stepTitles[currentStep].subtitle;

            // Update footer info
            footerInfo.textContent = `Step ${currentStep + 1} of ${totalSteps}`;

            // Scroll to top
            document.querySelector('.form-section').scrollTop = 0;
        }

        function submitForm() {
            console.log('Form submitted with data:', formData);
            alert('Form submitted successfully!\n\nForm data:\n' + JSON.stringify(formData, null, 2));
            // Reset form
            resetForm();
        }

        function resetForm() {
            currentStep = 0;
            formData = {};
            formSteps.forEach(step => {
                const inputs = step.querySelectorAll('input, select, textarea');
                inputs.forEach(input => {
                    if (input.type === 'checkbox' || input.type === 'radio') {
                        input.checked = false;
                    } else {
                        input.value = '';
                    }
                    input.style.borderColor = '';
                });
            });
            updateForm();
        }

        // Initialize
        updateForm();
    </script>
</body>
</html>
